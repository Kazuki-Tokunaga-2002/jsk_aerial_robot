aerial_robot_control_name: aerial_robot_control/delta_controller

controller:
  control_verbose: false
  hovering_approximate: false
  aerial_mode_add_joint_torque_constraint: false # joint torque constraints
  use_fc_for_att_control: false # attitude feedback by Spinal
  linear_mode: false # nonlinear NLOpt/SLSQP wrench allocation
  nlopt_phi_limit: 1.0471975512 # gimbal angle bound [rad] (pi/3)
  nlopt_lambda_weight: 1.0 # thrust effort cost
  nlopt_delta_lambda_weight: 0.0 # thrust command smoothing cost
  nlopt_delta_phi_weight: 0.0 # gimbal command smoothing cost
  nlopt_phi_nominal: 0.0 # preferred gimbal angle [rad]
  nlopt_phi_nominal_weight: 1.0 # preferred gimbal angle cost
  nlopt_lambda_balance_weight: 0.0 # rotor thrust balance cost
  ceiling_distance: 2.73 # ceiling height d0 in world z [m]
  ceiling_rotor_radius: 0.1905 # rotor radius R [m] for 15 inch prop
  ceiling_effect_min_dbar: 0.2 # lower l/R bound of the ceiling effect model
  ceiling_effect_max_theta: 0.6981317008 # upper tilt angle bound [rad] (40 deg)

  xy:
    p_gain: 5.0
    i_gain: 1.0
    d_gain: 2.5
    limit_sum: 4.0
    limit_p: 12.0
    limit_i: 12.0
    limit_d: 1.0

  z:
    p_gain: 5.0
    i_gain: 1.5
    d_gain: 2.5
    limit_err_p: 1.0
    limit_sum: 25.0 # N for clamping thrust force
    limit_p: 25.0
    limit_i: 25.0
    limit_d: 25.0
    force_landing_descending_rate: -0.5

  roll_pitch:
    start_rp_integration_height: 0.01

  roll:
    p_gain: 17.0
    i_gain: 0.5
    d_gain: 9.0
    limit_sum: 50.0
    limit_p: 50.0
    limit_i: 50.0
    limit_d: 50.0

  pitch:
    p_gain: 18.0
    i_gain: 0.5
    d_gain: 7.0
    limit_sum: 50.0
    limit_p: 50.0
    limit_i: 50.0
    limit_d: 50.0

  yaw:
    p_gain: 5.0
    i_gain: 2.0
    d_gain: 2.0
    limit_err_p: 2.0
    limit_sum: 20.0
    limit_p: 3.0
    limit_i: 20.0
    limit_d: 5.0

    need_d_control: true
